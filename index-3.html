<style>
:root{
  --kraft:#B08256;
  --kraft-dark:#6E4E30;
  --paper:#FBFAF7;
  --card:#FFFFFF;
  --ink:#2A241D;
  --ink-light:#8A7F70;
  --marker:#3D5A80;
  --marker-light:#E4EBF2;
  --done:#5B8266;
  --done-light:#E6EFE7;
  --over:#B5544A;
  --line:#E7E0D3;
  --font-display:'Archivo Black', 'Arial Black', sans-serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;width:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  padding-bottom:56px;
}
.container{max-width:480px;margin:0 auto;width:100%;}

header.app-header{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  padding:14px 16px 10px;
  border-bottom:1px solid var(--line);
}
.label-card{
  background:var(--card);
  border:2px dashed var(--kraft);
  border-radius:10px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
  transform:rotate(-0.4deg);
}
.tape{
  position:absolute;
  top:-10px;left:20px;
  width:56px;height:20px;
  background:rgba(176,130,86,0.35);
  border:1px solid rgba(176,130,86,0.5);
  transform:rotate(-3deg);
}
.stamp{
  flex-shrink:0;
  width:64px;height:64px;
  border-radius:50%;
  border:3px solid var(--marker);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-6deg);
  font-family:var(--font-mono);
  color:var(--marker);
}
.stamp .pct{font-size:18px;font-weight:700;line-height:1;}
.stamp .lbl{font-size:8px;letter-spacing:.03em;margin-top:1px;}
.label-info{flex:1;min-width:0;}
.label-title{
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:.02em;
  color:var(--kraft-dark);
  text-transform:uppercase;
}
.label-sub{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--ink);
  margin-top:4px;
  font-weight:600;
}
.progress-outer{
  margin-top:10px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;
}
.progress-inner{
  height:100%;background:var(--marker);border-radius:4px;width:0%;
  transition:width .4s ease;
}
.hint-text{
  font-size:11.5px;
  color:var(--ink-light);
  text-align:center;
  margin-top:9px;
  padding:0 6px;
}
.hint-text b{color:var(--marker);}
.sync-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;
  padding:3px 8px;border-radius:20px;margin-top:6px;
}
.sync-badge.on{background:var(--done-light);color:var(--done);}
.sync-badge.off{background:var(--marker-light);color:var(--marker);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

main{padding:14px 16px 0;}
details.category{margin-bottom:14px;}
summary.category-summary{
  list-style:none;
  cursor:pointer;
  background:var(--kraft);
  color:#fff;
  font-family:var(--font-display);
  font-size:12.5px;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:12px 14px;
  border-radius:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  position:relative;
}
details.category:nth-of-type(even) summary.category-summary{transform:rotate(.35deg);}
details.category:nth-of-type(odd) summary.category-summary{transform:rotate(-.35deg);}
summary.category-summary::-webkit-details-marker{display:none;}
summary.category-summary::marker{content:'';}
.sum-left{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sum-emoji{font-size:14px;flex-shrink:0;}
.sum-right{
  font-family:var(--font-mono);
  text-transform:none;
  letter-spacing:0;
  font-size:11px;
  font-weight:600;
  opacity:.95;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex-shrink:2;
  max-width:40%;
}
.sum-add-btn{
  flex-shrink:0;
  width:23px;height:23px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.28);
  color:#fff;
  font-size:15px;
  font-weight:700;
  line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  padding:0;
}
.sum-add-btn:active{background:rgba(255,255,255,.5);}
.chev{font-size:11px;transition:transform .2s ease;flex-shrink:0;}
details[open] summary.category-summary .chev{transform:rotate(180deg);}

.items-wrap{
  background:var(--card);
  border:1px solid var(--line);
  border-top:none;
  border-radius:0 0 6px 6px;
  overflow:hidden;
  margin-top:-2px;
}

.item-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.item-row:last-child{border-bottom:none;}
.item-row:active{background:var(--marker-light);}
.item-check{
  width:22px;height:22px;flex-shrink:0;
  border:2px solid var(--kraft);
  border-radius:6px;
  position:relative;
}
.item-row.bought .item-check{background:var(--done);border-color:var(--done);}
.item-row.bought .item-check::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:700;
}
.item-info{flex:1;min-width:0;}
.item-name{font-size:14.5px;font-weight:500;color:var(--ink);}
.item-row.bought .item-name{color:var(--ink-light);}
.item-notes{font-size:12px;color:var(--ink-light);margin-top:2px;}
.item-link{
  display:inline-block;font-size:11.5px;color:var(--marker);margin-top:3px;text-decoration:none;font-weight:600;
}
.item-price{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:600;
  text-align:right;
  flex-shrink:0;
  color:var(--ink);
}
.item-row.bought .item-price{color:var(--done);}
.diff-over{color:var(--over);font-size:11px;display:block;}
.diff-under{color:var(--done);font-size:11px;display:block;}

.add-item-row{padding:12px 14px;border-top:1px solid var(--line);}
.btn-add-item{
  width:100%;
  background:none;
  border:2px dashed var(--kraft);
  border-radius:8px;
  padding:10px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:13px;
  color:var(--kraft-dark);
  cursor:pointer;
}
.add-item-form{
  padding:12px 14px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.add-item-form input{
  border:2px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  font-family:var(--font-body);
  font-size:14px;
  color:var(--ink);
  outline:none;
  width:100%;
}
.add-item-form input:focus{border-color:var(--marker);}
.add-item-form input.add-price-field{font-family:var(--font-mono);}
.add-form-actions{display:flex;gap:8px;}
.add-form-actions button{
  flex:1;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font-body);
}
.btn-cancel-add{background:var(--line);color:var(--ink);}
.btn-save-add{background:var(--marker);color:#fff;}
.item-delete{
  flex-shrink:0;
  width:26px;height:26px;
  border:none;background:none;
  color:var(--ink-light);
  font-size:15px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.item-delete:active{color:var(--over);}

.modal-overlay{
  position:fixed;inset:0;background:rgba(42,36,29,.55);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--card);width:100%;max-width:480px;
  border-radius:16px 16px 0 0;padding:22px 20px 26px;
}
.modal-name{font-family:var(--font-display);font-size:15px;color:var(--kraft-dark);text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px;}
.modal label{font-size:12.5px;color:var(--ink-light);display:block;margin-bottom:6px;}
.price-input-wrap{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;padding:0 14px;}
.price-input-wrap:focus-within{border-color:var(--marker);}
.price-input-wrap span{font-family:var(--font-mono);color:var(--ink-light);font-size:16px;}
#price-input{
  border:none;outline:none;background:transparent;font-family:var(--font-mono);
  font-size:18px;padding:12px 8px;width:100%;color:var(--ink);
}
.modal-error{color:var(--over);font-size:12px;margin-top:6px;min-height:16px;}
.btn-quick{
  width:100%;background:var(--marker-light);color:var(--marker);border:none;border-radius:10px;
  padding:11px;font-family:var(--font-body);font-size:13px;font-weight:600;margin-top:12px;cursor:pointer;
}
.modal-actions-main{display:flex;gap:10px;margin-top:14px;}
.modal-actions-main button{
  flex:1;border:none;border-radius:10px;padding:13px;font-family:var(--font-body);font-weight:700;font-size:14px;cursor:pointer;
}
#btn-cancel{background:var(--line);color:var(--ink);}
#btn-save{background:var(--marker);color:#fff;}
.btn-unmark{
  width:100%;background:none;color:var(--over);border:none;padding:12px;margin-top:8px;font-size:13px;font-weight:600;cursor:pointer;
}

footer{padding:22px 16px 10px;text-align:center;}
#btn-reset{
  background:none;border:1px solid var(--line);color:var(--ink-light);
  padding:8px 16px;border-radius:20px;font-family:var(--font-body);font-size:12px;cursor:pointer;
}

.loading-msg{text-align:center;color:var(--ink-light);font-size:13px;padding:30px 0;}

:focus-visible{outline:2px solid var(--marker);outline-offset:2px;}

@media (max-width:360px){
  .stamp{width:54px;height:54px;}
  .stamp .pct{font-size:15px;}
  .label-card{gap:10px;padding:11px;}
  .label-title{font-size:13.5px;}
  .label-sub{font-size:11.5px;}
  .sum-right{font-size:10px;}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>

<div class="container">

      </div>
    </div>
    <div class="hint-text">Toca una categoría para verla, o el <b>+</b> para añadir un artículo directamente</div>
  </header>

  <main id="categories-container"><div class="loading-msg">Cargando…</div></main>

  <footer>
    <button id="btn-reset" type="button">↺ Reiniciar progreso</button>
  </footer>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-name" id="modal-item-name"></div>
    <label for="price-input">Precio pagado</label>
    <div class="price-input-wrap">
      <span>€</span>
      <input type="number" id="price-input" step="0.01" min="0" inputmode="decimal" placeholder="0,00">
    </div>
    <div class="modal-error" id="modal-error"></div>
    <button class="btn-quick" id="btn-quick-fill" type="button"></button>
    <div class="modal-actions-main">
      <button id="btn-cancel" type="button">Cancelar</button>
      <button id="btn-save" type="button">Guardar</button>

    <button class="btn-unmark" id="btn-unmark" type="button">Marcar como no comprado</button>

</div>

function formatPrice(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}
function formatDiff(n){
  var sign = n>0 ? '+' : '';
  return sign+n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+'€';
}
function getCategoryItems(cat){
  var extra = CUSTOM_ITEMS[cat.id] || [];
  return cat.items.concat(extra);
}
function findCategoryById(catId){
  for(var c=0;c<CATEGORIES.length;c++){
    if(CATEGORIES[c].id===catId) return CATEGORIES[c];
  }
  return null;
}
function findItem(itemId){
  for(var c=0;c<CATEGORIES.length;c++){
    var items = getCategoryItems(CATEGORIES[c]);
    for(var i=0;i<items.length;i++){
      if(items[i].id===itemId) return items[i];
    }
  }
  return null;
}
function findCategoryByItemId(itemId){
  for(var c=0;c<CATEGORIES.length;c++){
    var items = getCategoryItems(CATEGORIES[c]);
    for(var i=0;i<items.length;i++){
      if(items[i].id===itemId) return CATEGORIES[c];
    }
  }
  return null;
}
function applyDefaultsForMissing(){
  for(var c=0;c<CATEGORIES.length;c++){
    var items = getCategoryItems(CATEGORIES[c]);
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(!(it.id in STATE)){
        STATE[it.id] = { bought: it.seedBought||false, actual: (it.seedActual===undefined?null:it.seedActual) };
      }
    }
  }
}

/* ---- almacenamiento local (Claude o localStorage del navegador) ---- */
async function storageGet(key){
  if(window.storage && typeof window.storage.get==='function'){
    try{
      var r = await window.storage.get(key, false);
      if(r && typeof r.value==='string') return r.value;
    }catch(e){}
  }
  try{
    var v = localStorage.getItem(key);
    if(v!==null) return v;
  }catch(e){}
  return null;
}
async function storageSet(key, value){
  if(window.storage && typeof window.storage.set==='function'){
    try{ await window.storage.set(key, value, false); }catch(e){}
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function loadLocalOnly(){
  var raw = await storageGet('compras-estado');
  var saved = null;
  try{ if(raw) saved = JSON.parse(raw); }catch(e){ saved = null; }
  STATE = saved || {};

  var rawCustom = await storageGet('compras-custom');
  var savedCustom = null;
  try{ if(rawCustom) savedCustom = JSON.parse(rawCustom); }catch(e){ savedCustom = null; }
  CUSTOM_ITEMS = savedCustom || {};

  applyDefaultsForMissing();
}

/* ---- Firebase (compartido en tiempo real, opcional) ---- */
function firebaseIsConfigured(){
  return firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('TU_')!==0;
}
async function initFirebaseIfConfigured(){
  if(!firebaseIsConfigured()) return false;
  try{
    var appMod = await import('https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js');
    var dbMod = await import('https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js');
    var app = appMod.initializeApp(firebaseConfig);
    fbDb = dbMod.getDatabase(app);
    fbRef = dbMod.ref;
    fbSet = dbMod.set;
    fbOnValue = dbMod.onValue;
    FIREBASE_READY = true;
    return true;
  }catch(e){
    console.error('No se pudo conectar con Firebase, se usará solo almacenamiento local', e);
    FIREBASE_READY = false;
    return false;
  }
}
function firebaseWrite(path, value){
  try{
    var p = fbSet(fbRef(fbDb, path), value);
    if(p && typeof p.catch==='function'){
      p.catch(function(e){ console.error('Firebase write error', e); });
    }
  }catch(e){ console.error('Firebase write error', e); }
}
function persistState(){
  if(FIREBASE_READY && fbDb) firebaseWrite(FIREBASE_DATA_PATH+'/estado', STATE);
  storageSet('compras-estado', JSON.stringify(STATE));
}
function persistCustomItems(){
  if(FIREBASE_READY && fbDb) firebaseWrite(FIREBASE_DATA_PATH+'/custom', CUSTOM_ITEMS);
  storageSet('compras-custom', JSON.stringify(CUSTOM_ITEMS));
}

function computeCategoryStats(cat){
  var items = getCategoryItems(cat);
  var boughtCount=0, spent=0, currentEstimate=0;
  for(var i=0;i<items.length;i++){
    var it = items[i];
    var st = STATE[it.id];
    if(st && st.bought){
      boughtCount++;
      spent += (st.actual||0);
      currentEstimate += (st.actual||0);
    }else{
      if(it.price!==null) currentEstimate += it.price;
    }
  }
  return {boughtCount:boughtCount, total:items.length, spent:spent, estimatedTotal:currentEstimate};
}
function computeGlobalStats(){
  var boughtCount=0,totalCount=0,spent=0,estimatedTotal=0;
  for(var c=0;c<CATEGORIES.length;c++){
    var s = computeCategoryStats(CATEGORIES[c]);
    boughtCount+=s.boughtCount; totalCount+=s.total; spent+=s.spent; estimatedTotal+=s.estimatedTotal;
  }
  return {boughtCount:boughtCount,totalCount:totalCount,spent:spent,estimatedTotal:estimatedTotal};
}

function buildItemRow(it){
  var row = document.createElement('div');
  row.className = 'item-row';
  row.id = 'row-'+it.id;

  var checkWrap = document.createElement('div');
  checkWrap.className = 'item-check';
  row.appendChild(checkWrap);

  var info = document.createElement('div');
  info.className = 'item-info';
  var nameEl = document.createElement('div');
  nameEl.className = 'item-name';
  nameEl.textContent = it.name;
  info.appendChild(nameEl);

  if(it.notes){
    var notesEl = document.createElement('div');
    notesEl.className = 'item-notes';
    notesEl.textContent = it.notes;
    info.appendChild(notesEl);
  }
  if(it.link){
    var linkEl = document.createElement('a');
    linkEl.className = 'item-link';
    linkEl.href = it.link;
    linkEl.target = '_blank';
    linkEl.rel = 'noopener noreferrer';
    linkEl.textContent = '🔗 Ver producto';
    linkEl.addEventListener('click', function(e){ e.stopPropagation(); });
    info.appendChild(linkEl);
  }
  row.appendChild(info);

  var priceEl = document.createElement('div');
  priceEl.className = 'item-price';
  priceEl.id = 'price-'+it.id;
  row.appendChild(priceEl);

  if(it.custom){
    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'item-delete';
    delBtn.textContent = '✕';
    delBtn.setAttribute('aria-label','Eliminar artículo');
    delBtn.addEventListener('click', function(e){
      e.stopPropagation();
      deleteCustomItem(it.id);
    });
    row.appendChild(delBtn);
  }

  row.addEventListener('click', function(){ openModal(this.id.replace('row-','')); });

  return row;
}

function updateItemUI(itemId){
  var it = findItem(itemId);
  var st = STATE[itemId];
  var row = document.getElementById('row-'+itemId);
  var priceEl = document.getElementById('price-'+itemId);
  if(!row||!priceEl||!it) return;
  priceEl.innerHTML = '';

  if(st && st.bought){
    row.classList.add('bought');
    var mainSpan = document.createElement('span');
    mainSpan.textContent = formatPrice(st.actual);
    priceEl.appendChild(mainSpan);
    if(it.price!==null && st.actual!==null){
      var diff = st.actual - it.price;
      if(Math.abs(diff)>=0.01){
        var diffSpan = document.createElement('span');
        diffSpan.className = diff>0 ? 'diff-over' : 'diff-under';
        diffSpan.textContent = formatDiff(diff);
        priceEl.appendChild(diffSpan);
      }
    }
  }else{
    row.classList.remove('bought');
    priceEl.textContent = formatPrice(it.price);
  }
}

function buildAddItemUI(catId){
  var wrap = document.createElement('div');
  wrap.id = 'addwrap-'+catId;
  var row = document.createElement('div');
  row.className = 'add-item-row';
  var btn = document.createElement('button');
  btn.className = 'btn-add-item';
  btn.type = 'button';
  btn.textContent = '+ Añadir artículo';
  btn.addEventListener('click', function(){ showAddForm(catId); });
  row.appendChild(btn);
  wrap.appendChild(row);
  return wrap;
}

function renderAddButton(catId){
  var wrap = document.getElementById('addwrap-'+catId);
  if(!wrap) return;
  wrap.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'add-item-row';
  var btn = document.createElement('button');
  btn.className = 'btn-add-item';
  btn.type = 'button';
  btn.textContent = '+ Añadir artículo';
  btn.addEventListener('click', function(){ showAddForm(catId); });
  row.appendChild(btn);
  wrap.appendChild(row);
}

function showAddForm(catId){
  var wrap = document.getElementById('addwrap-'+catId);
  if(!wrap) return;
  wrap.innerHTML = '';
  var form = document.createElement('div');
  form.className = 'add-item-form';

  var nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.placeholder = 'Nombre del artículo';
  nameInput.id = 'add-name-'+catId;

  var priceInput = document.createElement('input');
  priceInput.type = 'number';
  priceInput.step = '0.01';
  priceInput.min = '0';
  priceInput.inputMode = 'decimal';
  priceInput.placeholder = 'Precio estimado (opcional)';
  priceInput.className = 'add-price-field';
  priceInput.id = 'add-price-'+catId;

  var err = document.createElement('div');
  err.className = 'modal-error';
  err.id = 'add-error-'+catId;

  var actions = document.createElement('div');
  actions.className = 'add-form-actions';
  var cancelBtn = document.createElement('button');
  cancelBtn.type='button'; cancelBtn.className='btn-cancel-add'; cancelBtn.textContent='Cancelar';
  cancelBtn.addEventListener('click', function(){ renderAddButton(catId); });
  var saveBtn = document.createElement('button');
  saveBtn.type='button'; saveBtn.className='btn-save-add'; saveBtn.textContent='Añadir';
  saveBtn.addEventListener('click', function(){ submitAddItem(catId); });

  nameInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); priceInput.focus(); } });
  priceInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitAddItem(catId); } });

  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);

  form.appendChild(nameInput);
  form.appendChild(priceInput);
  form.appendChild(err);
  form.appendChild(actions);
  wrap.appendChild(form);
  setTimeout(function(){ nameInput.focus(); }, 30);
}

function submitAddItem(catId){
  var nameInput = document.getElementById('add-name-'+catId);
  var priceInput = document.getElementById('add-price-'+catId);
  var errEl = document.getElementById('add-error-'+catId);
  var name = (nameInput.value||'').trim();
  if(!name){
    errEl.textContent = 'Escribe un nombre';
    return;
  }
  var priceRaw = (priceInput.value||'').toString().replace(',','.');
  var price = priceRaw==='' ? null : parseFloat(priceRaw);
  if(price!==null && (isNaN(price)||price<0)){
    errEl.textContent = 'Precio no válido';
    return;
  }
  var newId = 'custom-'+catId+'-'+Date.now()+'-'+Math.floor(Math.random()*1000);
  var newItem = { id:newId, name:name, price:price, notes:'', link:null, custom:true };
  if(!CUSTOM_ITEMS[catId]) CUSTOM_ITEMS[catId] = [];
  CUSTOM_ITEMS[catId].push(newItem);
  STATE[newId] = { bought:false, actual:null };
  persistCustomItems();
  persistState();

  var itemsWrap = document.getElementById('items-'+catId);
  var addWrap = document.getElementById('addwrap-'+catId);
  if(itemsWrap && !document.getElementById('row-'+newId)){
    itemsWrap.insertBefore(buildItemRow(newItem), addWrap);
  }
  updateItemUI(newId);

  var cat = findCategoryById(catId);
  if(cat) updateCategorySummary(cat);
  updateGlobalStats();

  nameInput.value = '';
  priceInput.value = '';
  errEl.textContent = '';
  nameInput.focus();
}

function deleteCustomItem(itemId){
  if(!confirm('¿Eliminar este artículo?')) return;
  var catId = null;
  for(var cId in CUSTOM_ITEMS){
    var arr = CUSTOM_ITEMS[cId];
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===itemId){ arr.splice(i,1); catId = cId; break; }
    }
    if(catId) break;
  }
  delete STATE[itemId];
  persistCustomItems();
  persistState();

  var row = document.getElementById('row-'+itemId);
  if(row) row.remove();

  if(catId){
    var cat = findCategoryById(catId);
    if(cat) updateCategorySummary(cat);
  }
  updateGlobalStats();
}

function buildCategorySection(cat){
  var details = document.createElement('details');
  details.className = 'category';
  details.id = 'cat-'+cat.id;

  var summary = document.createElement('summary');
  summary.className = 'category-summary';
  summary.id = 'summary-'+cat.id;

  var sumLeft = document.createElement('span');
  sumLeft.className = 'sum-left';

  var sumRight = document.createElement('span');
  sumRight.className = 'sum-right';
  sumRight.id = 'sumright-'+cat.id;

  var addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'sum-add-btn';
  addBtn.textContent = '+';
  addBtn.setAttribute('aria-label', 'Añadir artículo en '+cat.name);
  addBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    if(!details.open) details.open = true;
    showAddForm(cat.id);
    setTimeout(function(){
      var wrap = document.getElementById('addwrap-'+cat.id);
      if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'center'});
    }, 60);
  });

  var chev = document.createElement('span');
  chev.className = 'chev';
  chev.textContent = '▾';

  summary.appendChild(sumLeft);
  summary.appendChild(sumRight);
  summary.appendChild(addBtn);
  summary.appendChild(chev);
  details.appendChild(summary);

  var itemsWrap = document.createElement('div');
  itemsWrap.className = 'items-wrap';
  itemsWrap.id = 'items-'+cat.id;
  var allItems = getCategoryItems(cat);
  for(var i=0;i<allItems.length;i++){
    itemsWrap.appendChild(buildItemRow(allItems[i]));
  }
  itemsWrap.appendChild(buildAddItemUI(cat.id));
  details.appendChild(itemsWrap);

  var em = document.createElement('span'); em.className='sum-emoji'; em.textContent = cat.emoji;
  var nmTxt = document.createTextNode(' '+cat.name);
  sumLeft.appendChild(em); sumLeft.appendChild(nmTxt);

  return details;
}

function updateCategorySummary(cat){
  var s = computeCategoryStats(cat);
  var el = document.getElementById('sumright-'+cat.id);
  if(!el) return;
  el.textContent = s.boughtCount+'/'+s.total+' · '+formatPrice(s.spent)+' de '+formatPrice(s.estimatedTotal);
}

function updateGlobalStats(){
  var s = computeGlobalStats();
  var statsEl = document.getElementById('global-stats');
  if(statsEl) statsEl.textContent = s.boughtCount+' / '+s.totalCount+' comprados · '+formatPrice(s.spent)+' de '+formatPrice(s.estimatedTotal);
  var bar = document.getElementById('global-progress');
  var pct = s.totalCount ? Math.round((s.boughtCount/s.totalCount)*100) : 0;
  if(bar) bar.style.width = pct+'%';
  var stampPct = document.getElementById('stamp-pct');
  if(stampPct) stampPct.textContent = pct+'%';
}

/* reconcilia filas nuevas/eliminadas (artículos personalizados que llegaron por Firebase) */
function syncItemRows(){
  for(var c=0;c<CATEGORIES.length;c++){
    var cat = CATEGORIES[c];
    var itemsWrap = document.getElementById('items-'+cat.id);
    var addWrap = document.getElementById('addwrap-'+cat.id);
    if(!itemsWrap || !addWrap) continue;
    var currentItems = getCategoryItems(cat);
    var currentIds = {};
    for(var i=0;i<currentItems.length;i++){
      currentIds[currentItems[i].id] = true;
      if(!document.getElementById('row-'+currentItems[i].id)){
        itemsWrap.insertBefore(buildItemRow(currentItems[i]), addWrap);
      }
    }
    var rows = itemsWrap.querySelectorAll('.item-row');
    for(var r=0;r<rows.length;r++){
      var rid = rows[r].id.replace('row-','');
      if(!currentIds[rid]) rows[r].remove();
    }
  }
}

function renderAll(){
  var container = document.getElementById('categories-container');
  container.innerHTML = '';
  for(var c=0;c<CATEGORIES.length;c++){
    container.appendChild(buildCategorySection(CATEGORIES[c]));
  }
  onRemoteDataChanged();
}

function onRemoteDataChanged(){
  syncItemRows();
  for(var c=0;c<CATEGORIES.length;c++){
    var cat = CATEGORIES[c];
    updateCategorySummary(cat);
    var items = getCategoryItems(cat);
    for(var i=0;i<items.length;i++){
      updateItemUI(items[i].id);
    }
  }
  updateGlobalStats();
}

function openModal(itemId){
  currentModalItemId = itemId;
  var it = findItem(itemId);
  var st = STATE[itemId];
  document.getElementById('modal-item-name').textContent = it.name;
  var input = document.getElementById('price-input');
  input.value = (st && st.bought && st.actual!==null) ? st.actual : (it.price!==null ? it.price : '');
  document.getElementById('modal-error').textContent = '';

  var quickBtn = document.getElementById('btn-quick-fill');
  if(it.price!==null){
    quickBtn.style.display = 'block';
    quickBtn.textContent = 'Usar precio estimado ('+formatPrice(it.price)+')';
  }else{
    quickBtn.style.display = 'none';
  }

  var unmarkBtn = document.getElementById('btn-unmark');
  unmarkBtn.style.display = (st && st.bought) ? 'block' : 'none';

  document.getElementById('modal-overlay').classList.add('active');
  setTimeout(function(){ input.focus(); }, 50);
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
  currentModalItemId = null;
}
function refreshAfterChange(itemId){
  updateItemUI(itemId);
  var cat = findCategoryByItemId(itemId);
  if(cat) updateCategorySummary(cat);
  updateGlobalStats();
}
function saveModal(){
  var input = document.getElementById('price-input');
  var raw = (input.value||'').toString().replace(',','.');
  var val = parseFloat(raw);
  if(isNaN(val) || val<0){
    document.getElementById('modal-error').textContent = 'Introduce un precio válido';
    return;
  }
  STATE[currentModalItemId] = { bought:true, actual:val };
  persistState();
  refreshAfterChange(currentModalItemId);
  closeModal();
}
function unmarkItem(){
  STATE[currentModalItemId] = { bought:false, actual:null };
  persistState();
  refreshAfterChange(currentModalItemId);
  closeModal();
}
function resetAll(){
  if(!confirm('¿Seguro que quieres borrar todo el progreso guardado? (Los artículos que añadiste no se borran, solo su estado de comprado)')) return;
  STATE = {};
  applyDefaultsForMissing();
  persistState();
  refreshAllUI();
}
function refreshAllUI(){
  for(var c=0;c<CATEGORIES.length;c++){
    var cat = CATEGORIES[c];
    updateCategorySummary(cat);
    var items = getCategoryItems(cat);
    for(var i=0;i<items.length;i++) updateItemUI(items[i].id);
  }
  updateGlobalStats();
}

document.getElementById('btn-save').addEventListener('click', saveModal);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('btn-unmark').addEventListener('click', unmarkItem);
document.getElementById('btn-quick-fill').addEventListener('click', function(){
  var it = findItem(currentModalItemId);
  if(it && it.price!==null) document.getElementById('price-input').value = it.price;
});
document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});
document.getElementById('btn-reset').addEventListener('click', resetAll);

function setSyncBadge(on){
  var badge = document.getElementById('sync-badge');
  var text = document.getElementById('sync-badge-text');
  if(!badge||!text) return;
  if(on){
    badge.className = 'sync-badge on';
    text.textContent = 'Sincronizado';
  }else{
    badge.className = 'sync-badge off';
    text.textContent = 'Solo este dispositivo';
  }
}

function firstRenderIfNeeded(){
  if(!FIRST_RENDER_DONE){
    FIRST_RENDER_DONE = true;
    renderAll();
  }else{
    onRemoteDataChanged();
  }
}

async function init(){
  var connected = await initFirebaseIfConfigured();
  if(connected){
    setSyncBadge(true);
    var estadoLoaded = false, customLoaded = false;
    fbOnValue(fbRef(fbDb, FIREBASE_DATA_PATH+'/estado'), function(snap){
      STATE = snap.val() || {};
      applyDefaultsForMissing();
      estadoLoaded = true;
      if(estadoLoaded && customLoaded) firstRenderIfNeeded();
    });
    fbOnValue(fbRef(fbDb, FIREBASE_DATA_PATH+'/custom'), function(snap){
      CUSTOM_ITEMS = snap.val() || {};
      customLoaded = true;
      if(estadoLoaded && customLoaded) firstRenderIfNeeded();
    });
  }else{
    setSyncBadge(false);
    await loadLocalOnly();
    firstRenderIfNeeded();
  }
}
init();
</script>
